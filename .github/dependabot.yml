version: 2

updates:
  - package-ecosystem: npm # also handles pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Groups only apply to version updates unless they say otherwise, so security updates for transitive
    # dependencies used to arrive as one PR each. A dependency joins the first group that matches it.
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Astro and its integrations ship majors together and need the same manual review
      astro-major:
        applies-to: version-updates
        patterns:
          - astro
          - "@astrojs/*"
        update-types:
          - major
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns:
          - "*"
