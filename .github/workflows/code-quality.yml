name: Code Quality

on:
  pull_request:
    branches: [ main, preview ]
  push:
    branches: [ main, preview ]
  # Dispatched by Promote when a merge into preview didn't trigger a push run (e.g. Dependabot auto-merge)
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pnpm/setup@v3.0.0
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Takes less than eslint, so we run it first
      - name: Run Prettier check
        run: pnpm format:check

      # We also configured eslint-config-prettier to avoid conflicts
      - name: Run ESLint
        run: pnpm lint:check

      # Extra type checking for TypeScript, which is not covered by ESLint
      - name: Run TypeScript type check
        run: pnpm types:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pnpm/setup@v3.0.0
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run tests with coverage
        run: pnpm test:coverage

      # Updates a single comment per PR instead of adding a new one on every push.
      # Fork PRs get a read-only token, so they skip the comment.
      - name: Post coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT=$(python3 .github/scripts/coverage_comment.py)
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT" --edit-last --create-if-none

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pnpm/setup@v3.0.0
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Also runs the content check and renders every page and Open Graph image
      - name: Build site
        run: pnpm build
