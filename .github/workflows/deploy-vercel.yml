name: Deploy to Vercel

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TEAM: daniel-benitezs-projects-f70b8e1a

jobs:
  deploy:
    name: Deploy
    # Dependabot branches can't read Actions secrets, so a deploy would always fail there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Records a GitHub deployment, so commits and PRs get a "View deployment" link and the repo page
    # lists the latest Preview and Production URLs
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # pnpm/setup@v3.0.0
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Vercel configuration
        id: vercel-credentials
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Missing required GitHub Actions secret: ${variable}"
              exit 0
            fi
          done
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Link Vercel project
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"devfolio"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel environment
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            pnpm dlx vercel@59.1.3 pull --yes --environment=production --scope="$VERCEL_TEAM" --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@59.1.3 pull --yes --environment=preview --scope="$VERCEL_TEAM" --token="$VERCEL_TOKEN"
          fi

      - name: Build Vercel output
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            pnpm dlx vercel@59.1.3 build --prod --scope="$VERCEL_TEAM" --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@59.1.3 build --scope="$VERCEL_TEAM" --token="$VERCEL_TOKEN"
          fi

      # Uploads the prebuilt output as one archive instead of file by file: Vercel's free plan allows 5000 file
      # uploads a day, and every push to every branch deploys. Previews get a new URL on every push;
      # production is also aliased to pyan.dev.
      # The step fails unless `vercel deploy` succeeds *and* prints a deployment URL: some errors (like the
      # upload limit) still exit 0, and their text contains other links, such as one to the docs.
      - name: Deploy
        id: deploy
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: |
          args=(deploy --prebuilt --archive=tgz --scope="$VERCEL_TEAM" --token="$VERCEL_TOKEN")
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            args+=(--prod)
          fi
          status=0
          output=$(pnpm dlx vercel@59.1.3 "${args[@]}" 2>&1) || status=$?
          echo "$output"
          url=$(echo "$output" | grep -Eo 'https://[a-z0-9.-]+\.vercel\.app' | tail -n1 || true)
          if [ "$status" -ne 0 ] || [ -z "$url" ]; then
            echo "::error::vercel deploy failed (exit $status, deployment URL: ${url:-none})"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            public_url="https://pyan.dev"
          else
            public_url="$url"
          fi
          echo "url=$public_url" >> "$GITHUB_OUTPUT"
          echo "### Deployed \`$GITHUB_REF_NAME\`: $public_url" >> "$GITHUB_STEP_SUMMARY"
          if [ "$public_url" != "$url" ]; then
            echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
