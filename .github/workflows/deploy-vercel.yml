name: Deploy to Vercel

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Vercel configuration
        id: vercel-credentials
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Missing required GitHub Actions secret: ${variable}"
              exit 0
            fi
          done
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Link Vercel project
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"devfolio"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel environment
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            pnpm dlx vercel@59.1.3 pull --yes --environment=production --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@59.1.3 pull --yes --environment=preview --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          fi

      - name: Build Vercel output
        if: steps.vercel-credentials.outputs.configured == 'true'
        run: pnpm dlx vercel@59.1.3 build --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: github.ref_name != 'main' && steps.vercel-credentials.outputs.configured == 'true'
        run: pnpm dlx vercel@59.1.3 deploy --prebuilt --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Deploy production
        if: github.ref_name == 'main' && steps.vercel-credentials.outputs.configured == 'true'
        run: pnpm dlx vercel@59.1.3 deploy --prebuilt --prod --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
