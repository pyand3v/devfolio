name: Prepare Release

run-name: "Prepare New '${{ inputs.release_type }}' Release"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semantic version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow pushing commits/tags

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          # A PAT is required (not the default GITHUB_TOKEN) so that the tag pushed below
          # triggers the Build & Release workflow. Its owner must be able to bypass the
          # main and preview rulesets, since this job pushes to both directly.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # We re-use the code-quality gates to ensure code quality before releasing
      - name: Run Prettier check
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint:check

      - name: Run TypeScript type check
        run: pnpm types:check

      - name: Build site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and create git tag
        id: bump
        run: |
          pnpm version ${{ inputs.release_type }} -m "chore(release): v%s"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push commit and tags
        run: |
          git push origin HEAD:main
          git push origin --tags

      # Bring the release commit (and the promotion merges before it) back into preview so the
      # next preview -> main PR doesn't start behind main
      - name: Sync preview with main
        run: |
          git fetch origin preview
          git checkout -B preview origin/preview
          git merge --no-edit main
          git push origin preview

      - name: Output new version
        run: echo "🚀 Released version ${{ steps.bump.outputs.version }}"
